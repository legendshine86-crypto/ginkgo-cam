# 몇 분마다 명소 근처 카메라 화면을 찍어 gh-pages 브랜치(GitHub Pages)에 올린다
name: capture
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub 사정에 따라 5~15분 간격으로 실행돼요
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 이전 결과 가져오기
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: out
      - name: ffmpeg 준비
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 화면 찍기
        env:
          CAMS: ${{ secrets.CAMS }}
        run: node capture/capture.mjs
      - name: gh-pages에 올리기 (기록을 쌓지 않고 덮어써요)
        run: |
          cd out
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "capture $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
