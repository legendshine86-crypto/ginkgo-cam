# GitHub 서버(해외)에서 ITS·영상 서버에 접속되는지 확인하는 임시 점검
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://openapi.its.go.kr:9443/ https://www.its.go.kr/ http://cctvsec.ktict.co.kr/ http://cctvsec.ktict.co.kr:8081/; do
            echo "$u -> $(curl -m 12 -s -o /dev/null -w '%{http_code} connect=%{time_connect}s' "$u" || echo 'curl 실패')"
          done
